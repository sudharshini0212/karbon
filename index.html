    <script>
      // Ignore WebSocket closure errors in AI Studio iframe environment where HMR is disabled
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          event.reason.message === 'WebSocket closed without opened.' ||
          (typeof event.reason === 'string' && event.reason.includes('WebSocket')) ||
          (event.reason.stack && event.reason.stack.includes('vite'))
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('[vite]'))) {
          event.preventDefault();
        }
      });
    </script>
